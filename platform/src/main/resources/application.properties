server.address=${AGENTSHIP_BIND_ADDRESS:127.0.0.1}
server.port=${AGENTSHIP_PORT:4173}
server.error.include-message=never
spring.datasource.url=${AGENTSHIP_JDBC_URL}
spring.datasource.username=${AGENTSHIP_DB_USER}
spring.datasource.password=${AGENTSHIP_DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET search_path TO agentship_design, public, pg_catalog
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
spring.jackson.deserialization.fail-on-unknown-properties=true
agentship.local-verification=${AGENTSHIP_LOCAL_VERIFICATION:false}
agentship.verification-key=${AGENTSHIP_VERIFICATION_KEY:}
agentship.secure-cookie=${AGENTSHIP_SECURE_COOKIE:true}
